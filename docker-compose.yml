# 로컬 개발용 DB (PostgreSQL 16 + PostGIS). 06 §2.3, §7-2
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aircon
      POSTGRES_PASSWORD: aircon
      POSTGRES_DB: aircon
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
