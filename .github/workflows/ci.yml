name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aircon
          POSTGRES_PASSWORD: aircon
          POSTGRES_DB: aircon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aircon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aircon:aircon@localhost:5432/aircon_test
      E2E_DATABASE_URL: postgres://aircon:aircon@localhost:5432/aircon_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @aircon/web build
        env:
          # E2E가 이 빌드를 그대로 쓴다(주소 검색은 Mock)
          NEXT_PUBLIC_ADDRESS_DRIVER: mock
      - name: E2E (단계 완료 기준)
        env:
          E2E_SERVER: start
        run: |
          PGPASSWORD=aircon psql -h localhost -U aircon -d aircon_test -c "CREATE DATABASE aircon_e2e"
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
